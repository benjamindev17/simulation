<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Simule ton prêt">
  <!-- Fond Ultra Violet (couleur primaire de l'appli) -->
  <rect width="32" height="32" fill="#6a00f4"/>
  <!-- Toit -->
  <path d="M16 6 L27 15.5 L5 15.5 Z" fill="#ffffff"/>
  <!-- Corps de la maison -->
  <rect x="8.5" y="15.5" width="15" height="10.5" fill="#ffffff"/>
  <!-- Porte (reprend le fond, pour créer le contraste) -->
  <rect x="14.2" y="19.5" width="3.6" height="6.5" fill="#6a00f4"/>
  <!-- Fenêtre : accent Soft Apricot -->
  <rect x="10.4" y="18" width="2.6" height="2.6" fill="#ffd6a5"/>
</svg>
