<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Simulation patrimoine">
  <!-- Fond arrondi vert mousse (couleur d'accent de l'appli) -->
  <rect width="32" height="32" rx="7" fill="#3c5b43"/>
  <!-- Toit -->
  <path d="M16 6 L27 15.5 L5 15.5 Z" fill="#f7f5ef"/>
  <!-- Corps de la maison -->
  <rect x="8.5" y="15.5" width="15" height="10.5" fill="#f7f5ef"/>
  <!-- Porte (ton mousse pour créer le contraste) -->
  <rect x="14.2" y="19.5" width="3.6" height="6.5" rx="0.6" fill="#3c5b43"/>
  <!-- Petit accent ambré : fenêtre -->
  <rect x="10.4" y="18" width="2.6" height="2.6" rx="0.5" fill="#a97a2c"/>
</svg>
